name: Nova external production-resource policy

on:
  push:
    paths:
      - "nova-ancient-warrior/tools/research/production_pipeline_catalog.json"
      - "nova-ancient-warrior/tests/test_production_pipeline_catalog.py"
      - ".github/workflows/nova-resource-catalog-validation.yml"
  pull_request:
    paths:
      - "nova-ancient-warrior/tools/research/production_pipeline_catalog.json"
      - "nova-ancient-warrior/tests/test_production_pipeline_catalog.py"
      - ".github/workflows/nova-resource-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-resource-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate external resource catalog policy
        working-directory: nova-ancient-warrior
        run: |
          python -m py_compile tests/test_production_pipeline_catalog.py
          python -m unittest tests/test_production_pipeline_catalog.py -v
