name: Claude Code independent PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether Anthropic API secret is configured
        id: check
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Claude review skipped: add ANTHROPIC_API_KEY to repository Actions secrets to enable it."
          fi

  claude-review:
    needs: check-secret
    if: needs.check-secret.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Review pull request with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Perform an independent, read-only code review of this pull request.
            Read AGENTS.md, CLAUDE.md, and AI_DEVELOPMENT_WORKFLOW.md first.
            Focus on correctness, security, regressions, mobile performance,
            dependency and asset licensing, and missing tests.
            Report only actionable findings with file and line references.
            Do not modify files, push commits, merge the pull request, or publish releases.
          claude_args: |
            --max-turns 5
