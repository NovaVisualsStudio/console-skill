name: PS2 homebrew first build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ps2-homebrew-first-build.yml"
      - "ps2-game/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ps2-homebrew-first-build.yml"
      - "ps2-game/**"

permissions:
  contents: read

jobs:
  build-nova-dodge:
    name: Build original Nova Dodge PS2 game
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps2dev/ps2sdk:latest
    steps:
      - name: Install host utilities
        run: apk add --no-cache git make gmp mpc1 mpfr4

      - name: Fetch this branch's game source
        shell: sh
        run: |
          set -eu
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$branch" "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/nova-console-skill
          test -s /tmp/nova-console-skill/ps2-game/main.c
          test -s /tmp/nova-console-skill/ps2-game/Makefile

      - name: Build PS2 ELF
        shell: sh
        run: |
          set -eu
          cd /tmp/nova-console-skill/ps2-game
          test -d "$PS2SDK"
          test -f "$PS2SDK/samples/Makefile.pref"
          make -j2
          test -s nova_dodge.elf
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp nova_dodge.elf "$GITHUB_WORKSPACE/artifacts/nova_dodge.elf"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum nova_dodge.elf > SHA256SUMS.txt
          ls -lh nova_dodge.elf SHA256SUMS.txt

      - name: Upload PS2 game ELF
        uses: actions/upload-artifact@v4
        with:
          name: nova-dodge-ps2-elf
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
