name: Godot Android prototype validation

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android-game/**"
      - "tests/test_godot_project.py"
      - ".github/workflows/godot-android-prototype.yml"
  pull_request:
    paths:
      - "android-game/**"
      - "tests/test_godot_project.py"
      - ".github/workflows/godot-android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot prototype (five gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify toolchain
        run: |
          python3 --version
          godot --version

      - name: Gate 1 - repository integrity tests
        run: python3 -m unittest discover -s tests -p 'test_godot_project.py' -v

      - name: Gate 2 - Godot editor import and script parse
        run: godot --headless --editor --path android-game --quit

      - name: Gate 3 - deterministic combat behaviour tests
        run: godot --headless --path android-game --script res://tests/combat_smoke.gd

      - name: Gate 4 - scene runtime smoke test
        run: godot --headless --path android-game --quit-after 5

      - name: Gate 5 - extended 300-frame runtime test
        run: godot --headless --path android-game --quit-after 300

      - name: Gate 6 - source hygiene and expected scene files
        run: |
          test -s android-game/project.godot
          test -s android-game/export_presets.cfg
          test -s android-game/scenes/main.tscn
          test -s android-game/scripts/main.gd
          test -s android-game/scripts/player.gd
          test -s android-game/scripts/enemy.gd
          ! find android-game -type f \( -name '*.elf' -o -name '*.iso' \) | grep .

      - name: Gate 7 - export Android debug APK
        run: |
          mkdir -p android-game/build
          godot --headless --editor --path android-game --quit
          godot --headless --path android-game --export-debug "Android" build/NovaAncientWarrior-debug.apk
          test -s android-game/build/NovaAncientWarrior-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ancient-warrior-android-debug
          path: android-game/build/NovaAncientWarrior-debug.apk
          if-no-files-found: error
          retention-days: 14
