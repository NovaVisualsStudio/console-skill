name: NOVA cinematic Android validation

on:
  push:
    branches: [main]
    paths:
      - "android-game/**"
      - "tests/test_godot_project.py"
      - ".github/workflows/godot-android-prototype.yml"
  pull_request:
    paths:
      - "android-game/**"
      - "tests/test_godot_project.py"
      - ".github/workflows/godot-android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot prototype (eight gates + repeat stability)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Godot 4.4.1 headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify toolchain
        run: |
          python3 --version
          godot --version
          echo "---- Godot Android editor settings ----"
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "---- Android export templates ----"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -name 'android_*' -print
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -x "$JAVA_HOME/bin/java"

      - name: Gate 1 - repository integrity tests
        run: python3 -m unittest discover -s tests -p 'test_godot_project.py' -v

      - name: Gate 2 - Godot editor import and script parse
        run: godot --headless --editor --path android-game --quit

      - name: Gate 3 - deterministic combat behaviour tests
        run: godot --headless --path android-game --script res://tests/combat_smoke.gd

      - name: Gate 4 - cinematic arena integration test
        run: godot --headless --verbose --path android-game --script res://tests/cinematic_smoke.gd

      - name: Gate 5 - procedural audio smoke test
        run: godot --headless --verbose --path android-game --script res://tests/audio_smoke.gd

      - name: Gate 6 - scene runtime smoke test
        run: godot --headless --verbose --path android-game --script res://tests/runtime_smoke.gd

      - name: Gate 7 - extended 300-frame runtime test
        run: godot --headless --path android-game --script res://tests/runtime_smoke.gd

      - name: Gate 8 - source hygiene and expected scene files
        run: |
          test -s android-game/project.godot
          test -s android-game/export_presets.cfg
          test -s android-game/scenes/main.tscn
          test -s android-game/scripts/main.gd
          test -s android-game/scripts/player.gd
          test -s android-game/scripts/enemy.gd
          test -s android-game/icon.svg
          test -s android-game/tests/runtime_smoke.gd
          ! find android-game -type f \( -name '*.elf' -o -name '*.iso' \) | grep .

      - name: Create temporary Android debug signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Gate 9 - export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd android-game
          mkdir -p build
          adb start-server
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/NovaAncientWarrior-debug.apk --verbose
          test -s build/NovaAncientWarrior-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/NovaAncientWarrior-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/NovaAncientWarrior-debug.apk | grep -F "package: name='com.novavisuals.ancientwarrior'"
          unzip -l build/NovaAncientWarrior-debug.apk | grep -F "lib/arm64-v8a/libgodot_android.so"

      - name: Gate 10 - six repeated gameplay and runtime passes
        run: |
          for pass in 1 2 3 4 5 6; do
            echo "===== STABILITY PASS $pass / 6 ====="
            python3 -m unittest discover -s tests -p 'test_godot_project.py' -v
            godot --headless --path android-game --script res://tests/combat_smoke.gd
            godot --headless --path android-game --script res://tests/cinematic_smoke.gd
            godot --headless --path android-game --script res://tests/audio_smoke.gd
            godot --headless --path android-game --script res://tests/runtime_smoke.gd
          done

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nova-ancient-warrior-android-debug
          path: android-game/build/NovaAncientWarrior-debug.apk
          if-no-files-found: error
          retention-days: 14
