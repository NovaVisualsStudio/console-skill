name: Nova Ancient Warrior — six-pass quality gate

on:
  push:
    branches: [nova-full-campaign-polish, release/nova-ancient-warrior-integration-20261108]
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/nova-six-pass-qa.yml"
  pull_request:
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/nova-six-pass-qa.yml"
  workflow_dispatch:

concurrency:
  group: nova-six-pass-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  six-pass-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Install free toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          python3 --version
          blender --background --python-expr "import bpy, numpy; print('BLENDER_NUMPY_OK', bpy.app.version_string, numpy.__version__)"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: "PASS 1/6 — static syntax and source integrity"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            nova-ancient-warrior/tools/blender/export_humanoid_for_godot.py \
            nova-ancient-warrior/tools/blender/generate_nova_hero.py \
            nova-ancient-warrior/tools/blender/optimize_mocap_glb.py \
            nova-ancient-warrior/tools/generate_game_audio.py \
            nova-ancient-warrior/tests/test_optimize_mocap_glb.py
          PYTHONPATH=nova-ancient-warrior/tools/blender python3 nova-ancient-warrior/tests/test_optimize_mocap_glb.py
          test -s nova-ancient-warrior/project.godot
          test -s nova-ancient-warrior/scenes/main.tscn
          echo "PASS 1: Python syntax and core project files valid"

      - name: "PASS 2/6 — verify realistic hero asset and original sound assets"
        shell: bash
        run: |
          set -euo pipefail
          python3 nova-ancient-warrior/tools/generate_game_audio.py --output nova-ancient-warrior/audio/generated
          hero="nova-ancient-warrior/assets/characters/nova_hero.glb"
          provenance="nova-ancient-warrior/assets/characters/ara_source_commit.txt"
          digest="nova-ancient-warrior/assets/characters/nova_hero.sha256"
          if [[ -s "$hero" && -s "$provenance" && -s "$digest" ]]; then
            expected="$(cat "$digest")"
            actual="$(sha256sum "$hero" | awk '{print $1}')"
            test "$expected" = "$actual"
            echo "PASS 2: verified Ara-generated realistic hero and original audio assets"
          else
            blender --background --python nova-ancient-warrior/tools/blender/generate_nova_hero.py -- --output "$hero"
            test -s "$hero"
          fi
          python3 -m py_compile nova-ancient-warrior/tools/blender/optimize_mocap_glb.py
          python3 nova-ancient-warrior/tools/blender/optimize_mocap_glb.py \
            "$hero" "$RUNNER_TEMP/nova_hero_mobile.glb" --max-mb 24
          cp "$RUNNER_TEMP/nova_hero_mobile.glb" "$hero"
          echo "PASS 2: verified hero provenance, removed unused facial morph targets, and generated original audio assets"

      - name: "PASS 3/6 — clean Godot import"
        shell: bash
        run: |
          set -euo pipefail
          import_log="$RUNNER_TEMP/godot-clean-import.log"
          if ! "$GODOT_BIN" --verbose --headless --editor --path nova-ancient-warrior --quit >"$import_log" 2>&1; then
            cat "$import_log"
            exit 1
          fi
          cat "$import_log"
          hero_scene="$(find nova-ancient-warrior/.godot/imported -type f -name 'nova_hero.glb-*.scn' -print -quit)"
          if [[ -z "$hero_scene" ]]; then
            echo "Godot did not produce the expected imported hero scene."
            echo "Import metadata:"
            cat nova-ancient-warrior/assets/characters/nova_hero.glb.import 2>/dev/null || true
            echo "Imported resource directory:"
            find nova-ancient-warrior/.godot/imported -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null | head -80 || true
            exit 1
          fi
          hero_scene_bytes="$(stat -c%s "$hero_scene")"
          echo "Imported hero scene: $hero_scene ($hero_scene_bytes bytes)"
          if (( hero_scene_bytes > 100000000 )); then
            echo "Hero import exceeds the 100 MB hard safety ceiling."
            exit 1
          fi
          echo "PASS 3: Godot imported project resources within the 100 MB safety ceiling"

      - name: "Diagnose exploration puzzle script compilation"
        shell: bash
        run: |
          set -euo pipefail
          puzzle_log="$RUNNER_TEMP/exploration-puzzle-compile.log"
          if ! "$GODOT_BIN" --headless --path nova-ancient-warrior --script res://tests/exploration_puzzle_compile_smoke.gd >"$puzzle_log" 2>&1; then
            cat "$puzzle_log"
            exit 1
          fi
          cat "$puzzle_log"
          if grep -E "SCRIPT ERROR:|ERROR:|ObjectDB instance was leaked|Leaked instance:|resources still in use" "$puzzle_log"; then
            exit 1
          fi

      - name: "PASS 4/6 — character, animation and audio integrity"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s nova-ancient-warrior/assets/characters/ara_source_commit.txt ]]; then
            "$GODOT_BIN" --headless --path nova-ancient-warrior --script res://tests/rigged_warrior_smoke.gd
          else
            echo "Ara hero import test deferred until the validated GLB is committed"
          fi
          for test_script in warrior_visual_smoke.gd audio_assets_smoke.gd pbr_material_smoke.gd; do
            "$GODOT_BIN" --headless --path nova-ancient-warrior --script "res://tests/$test_script"
          done
          echo "PASS 4: character, animation and audio smoke tests passed"

      - name: "PASS 5/6 — combat, campaign, save and hazard regression"
        shell: bash
        run: |
          set -euo pipefail
          combat_log="$RUNNER_TEMP/combat-window.log"
          if ! "$GODOT_BIN" --headless --path nova-ancient-warrior --script res://tests/combat_window_smoke.gd >"$combat_log" 2>&1; then
            cat "$combat_log"
            exit 1
          fi
          cat "$combat_log"
          grep -q "Combat window smoke test passed" "$combat_log"
          if grep -E "SCRIPT ERROR:|ERROR:|ObjectDB instance was leaked|Leaked instance:|RID allocations of type|resources still in use" "$combat_log"; then
            exit 1
          fi
          for test_script in enemy_tactics_smoke.gd narrative_director_smoke.gd mission_objective_smoke.gd chapter_scene_smoke.gd title_screen_smoke.gd gameplay_localization_smoke.gd combat_rules_smoke.gd save_manager_smoke.gd level_catalog_smoke.gd campaign_smoke.gd stage_builder_smoke.gd campaign_layout_smoke.gd exploration_secret_smoke.gd exploration_puzzle_smoke.gd campaign_spawn_clearance_smoke.gd stage_hazard_rules_smoke.gd touch_camera_controller_smoke.gd virtual_joystick_smoke.gd pause_menu_smoke.gd; do
            "$GODOT_BIN" --headless --path nova-ancient-warrior --script "res://tests/$test_script"
          done
          echo "PASS 5: gameplay and progression regression suite passed"

      - name: "PASS 6/6 — Android profile and real main-scene boot"
        shell: bash
        run: |
          set -euo pipefail
          mobile_log="$RUNNER_TEMP/mobile-render-profile.log"
          if ! "$GODOT_BIN" --verbose --headless --path nova-ancient-warrior --script res://tests/mobile_render_profile_smoke.gd >"$mobile_log" 2>&1; then
            cat "$mobile_log"
            exit 1
          fi
          cat "$mobile_log"
          if grep -E "SCRIPT ERROR:|ERROR:|ObjectDB instance was leaked|Leaked instance:|RID allocations of type|resources still in use" "$mobile_log"; then
            exit 1
          fi
          log_file="$RUNNER_TEMP/nova-main-scene.log"
          if ! "$GODOT_BIN" --verbose --headless --path nova-ancient-warrior --script res://tests/combat_window_smoke.gd >"$log_file" 2>&1; then
            cat "$log_file"
            exit 1
          fi
          cat "$log_file"
          grep -q "Combat window smoke test passed" "$log_file"
          if grep -E "SCRIPT ERROR:|ERROR:|ObjectDB instance was leaked|Leaked instance:|RID allocations of type|resources still in use" "$log_file"; then
            exit 1
          fi
          camera_log="$RUNNER_TEMP/third-person-camera.log"
          if ! "$GODOT_BIN" --verbose --headless --path nova-ancient-warrior --script res://tests/third_person_camera_rig_smoke.gd >"$camera_log" 2>&1; then
            cat "$camera_log"
            exit 1
          fi
          cat "$camera_log"
          grep -q "Third-person camera collision smoke test passed" "$camera_log"
          if grep -E "SCRIPT ERROR:|ERROR:|ObjectDB instance was leaked|Leaked instance:|RID allocations of type|resources still in use" "$camera_log"; then
            exit 1
          fi
          echo "PASS 6: Android profile, camera collision and main-scene boot passed"

      - name: Publish six-pass summary
        if: always()
        run: |
          {
            echo "## Nova Ancient Warrior — six-pass QA"
            echo ""
            echo "Six independent quality gates were executed in order:"
            echo "1. Static syntax and source integrity"
            echo "2. Hero/audio asset regeneration"
            echo "3. Clean Godot import"
            echo "4. Character, animation and audio integrity"
            echo "5. Combat, campaign, save and hazard regression"
            echo "6. Android render profile and main-scene boot"
            echo ""
            echo "A green workflow means all six gates passed in this CI environment. It does not replace visual review or physical Android-device testing."
          } >> "$GITHUB_STEP_SUMMARY"
