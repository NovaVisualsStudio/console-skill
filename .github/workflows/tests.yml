name: Tests

on:
  push:
    branches: [main, nova-android-vertical-slice, nova-gameplay-hardening, nova-gameplay-hardened-clean, nova-open-source-research, nova-six-toolchain-integration, nova-full-campaign-polish]
  pull_request:

concurrency:
  group: nova-python-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Run local-only DeepSeek review client tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f nova-ancient-warrior/tests/test_deepseek_review.py ]]; then
            python -m unittest discover \
              -s nova-ancient-warrior/tests \
              -p 'test_deepseek_review.py' -v
          else
            echo "No local DeepSeek review client tests in this branch; skipped."
          fi
