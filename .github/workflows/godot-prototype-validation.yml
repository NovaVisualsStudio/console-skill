name: Nova Ancient Warrior — Godot validation

on:
  push:
    branches: [main, nova-android-vertical-slice]
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/godot-prototype-validation.yml"
  pull_request:
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/godot-prototype-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import and parse project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path nova-ancient-warrior --quit

      - name: Smoke-run main scene
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --quit-after 120
