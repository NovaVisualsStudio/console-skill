name: Nova Ancient Warrior — Godot validation

on:
  push:
    branches: [main, nova-android-vertical-slice, nova-gameplay-hardening, nova-gameplay-hardened-clean, nova-open-source-research, nova-six-toolchain-integration]
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/godot-prototype-validation.yml"
  pull_request:
    paths:
      - "nova-ancient-warrior/**"
      - ".github/workflows/godot-prototype-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project resources
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path nova-ancient-warrior --quit

      - name: Strictly parse the gameplay script
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --check-only --script res://scripts/main.gd

      - name: Run deterministic gameplay combat checks
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --script res://tests/combat_rules_smoke.gd

      - name: Smoke-test articulated warrior visuals and animation methods
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --script res://tests/warrior_visual_smoke.gd

      - name: Verify save data and chapter unlock persistence
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --script res://tests/save_manager_smoke.gd

      - name: Smoke-run main scene and reject script errors
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          if ! ./Godot_v4.7.2-stable_linux.x86_64 --headless --path nova-ancient-warrior --quit-after 120 >"$log_file" 2>&1; then
            cat "$log_file"
            exit 1
          fi
          cat "$log_file"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script" "$log_file"; then
            exit 1
          fi
