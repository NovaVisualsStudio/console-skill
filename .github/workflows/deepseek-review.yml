name: DeepSeek advisory code review

on:
  push:
    paths:
      - "nova-ancient-warrior/tools/deepseek_review.py"
      - "nova-ancient-warrior/tests/test_deepseek_review.py"
      - ".github/workflows/deepseek-review.yml"
  pull_request:
    paths:
      - "nova-ancient-warrior/tools/deepseek_review.py"
      - "nova-ancient-warrior/tests/test_deepseek_review.py"
      - ".github/workflows/deepseek-review.yml"
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: false
        default: deepseek-flash
      base_ref:
        description: Branch to compare against
        required: false
        default: main

permissions:
  contents: read

jobs:
  offline-client-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test client syntax and local OpenAI-compatible endpoint
        working-directory: nova-ancient-warrior
        run: |
          python -m py_compile tools/deepseek_review.py tests/test_deepseek_review.py
          python -m unittest tests/test_deepseek_review.py -v

  hosted-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patch
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}"
          git diff --no-ext-diff --unified=5 "origin/${BASE_REF}...HEAD" -- nova-ancient-warrior > /tmp/nova.patch
          test -s /tmp/nova.patch || { echo "No project changes to review."; exit 2; }

      - name: Run read-only DeepSeek review
        working-directory: nova-ancient-warrior
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ inputs.model }}
        run: |
          python tools/deepseek_review.py --diff-file /tmp/nova.patch --output deepseek-review.md

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: nova-ancient-warrior-deepseek-review
          path: nova-ancient-warrior/deepseek-review.md
          if-no-files-found: error
          retention-days: 14
